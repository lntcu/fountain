[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fountain"
version = "1.0.0"
description = "Reliability-first screenplay PDF to Fountain converter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fountain contributors" }]
dependencies = [
  "PyMuPDF>=1.26,<2",
  "rich>=14,<15",
]

[project.scripts]
fountain = "fountain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fountain"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

